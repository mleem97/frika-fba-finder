<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FBA Finder</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand__mark" aria-hidden="true">F</div>
          <div>
            <p class="brand__title">FBA Finder</p>
            <p class="brand__meta">Smart Shopping Filter</p>
          </div>
        </div>
        <span class="version" data-version>v2.0.0</span>
      </header>

      <div class="content">
        <section class="card card--hero" aria-labelledby="filter-title">
          <div>
            <p class="eyebrow">Status</p>
            <h2 id="filter-title">Filter aktiv</h2>
            <p class="description">Bereinigt Suchergebnisse automatisch.</p>
            <div class="status-line"><span class="status-dot" id="pageStatusDot"></span><span id="pageStatus">Amazon-Seite wird geprüft</span></div>
          </div>
          <label class="switch" aria-label="FBA Finder aktivieren">
            <input type="checkbox" id="enabled" />
            <span class="switch__track"></span>
          </label>
        </section>

        <section class="card" aria-labelledby="stats-title">
          <h3 class="section-heading" id="stats-title">Diese Seite</h3>
          <div class="stats stats--six">
            <div class="stat"><span class="stat__value" id="hidden">0</span><span class="stat__label">Gefiltert</span></div>
            <div class="stat"><span class="stat__value" id="sponsored">0</span><span class="stat__label">Werbung</span></div>
            <div class="stat"><span class="stat__value" id="duplicate">0</span><span class="stat__label">Duplikate</span></div>
            <div class="stat"><span class="stat__value" id="recommended">0</span><span class="stat__label">Empfohlen</span></div>
            <div class="stat"><span class="stat__value" id="fbm">0</span><span class="stat__label">FBM</span></div>
            <div class="stat"><span class="stat__value" id="unknown">0</span><span class="stat__label">Unklar</span></div>
          </div>
        </section>

        <section class="card" aria-labelledby="quick-title">
          <h3 class="section-heading" id="quick-title">Schnellfilter</h3>
          <div class="setting-list">
            <label class="setting">
              <span><span class="setting__title">Diesen Shop filtern</span><span class="setting__hint" id="platformLabel">Aktuelle Plattform</span></span>
              <span class="switch"><input type="checkbox" id="platformEnabled" /><span class="switch__track"></span></span>
            </label>
            <label class="setting">
              <span><span class="setting__title">Gesponserte Treffer</span><span class="setting__hint">Werbung zuverlässig erkennen</span></span>
              <span class="switch"><input type="checkbox" id="hideSponsored" /><span class="switch__track"></span></span>
            </label>
            <label class="setting">
              <span><span class="setting__title">Plattform-Empfehlungen</span><span class="setting__hint">Eingeschobene Empfehlungen ausblenden</span></span>
              <span class="switch"><input type="checkbox" id="hideRecommended" /><span class="switch__track"></span></span>
            </label>
            <label class="setting">
              <span><span class="setting__title">Ähnliche Artikel bündeln</span><span class="setting__hint">Günstigsten Gesamtpreis behalten</span></span>
              <span class="switch"><input type="checkbox" id="deduplicate" /><span class="switch__track"></span></span>
            </label>
          </div>
        </section>

        <button class="button button--block" id="openOptions" type="button">Alle Einstellungen</button>
      </div>
      <footer class="footer">Lokal, ohne Tracking und ohne externe Datenübertragung.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
