name: Build Chrome Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Validate required files
        run: |
          echo "🔍 Checking required files..."
          REQUIRED_FILES=(
            "manifest.json"
            "content.js"
            "background.js"
            "popup.html"
            "popup.js"
            "options.html"
            "options.js"
            "icons/icon16.png"
            "icons/icon48.png"
            "icons/icon128.png"
          )
          
          MISSING_FILES=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
            fi
          done
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo "❌ ERROR: Missing required files:"
            printf '   - %s\n' "${MISSING_FILES[@]}"
            exit 1
          fi
          
          echo "✅ All required files found"

      - name: Create build directory
        run: |
          echo "📁 Creating build directory..."
          mkdir -p build/fba-finder

      - name: Copy extension files
        run: |
          echo "📋 Copying extension files..."
          
          # Core files
          cp manifest.json build/fba-finder/
          cp content.js build/fba-finder/
          cp background.js build/fba-finder/
          cp popup.html build/fba-finder/
          cp popup.js build/fba-finder/
          cp options.html build/fba-finder/
          cp options.js build/fba-finder/
          
          # Icons
          mkdir -p build/fba-finder/icons
          cp icons/icon16.png build/fba-finder/icons/
          cp icons/icon48.png build/fba-finder/icons/
          cp icons/icon128.png build/fba-finder/icons/
          
          # Documentation (optional but recommended)
          if [ -f "README.md" ]; then
            cp README.md build/fba-finder/
          fi
          if [ -f "CHANGELOG.md" ]; then
            cp CHANGELOG.md build/fba-finder/
          fi
          if [ -f "PRIVACY.md" ]; then
            cp PRIVACY.md build/fba-finder/
          fi
          
          echo "✅ Files copied successfully"

      - name: List build contents
        run: |
          echo "📦 Build contents:"
          find build/fba-finder -type f | sort

      - name: Create ZIP archive
        run: |
          echo "🗜️  Creating ZIP archive..."
          cd build
          zip -r ../fba-finder-chrome-store-${{ steps.get_version.outputs.VERSION }}.zip fba-finder/
          cd ..
          
          # Get file size
          SIZE=$(du -h fba-finder-chrome-store-${{ steps.get_version.outputs.VERSION }}.zip | cut -f1)
          echo "✅ ZIP created: fba-finder-chrome-store-${{ steps.get_version.outputs.VERSION }}.zip ($SIZE)"

      - name: Calculate SHA256 checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum fba-finder-chrome-store-${{ steps.get_version.outputs.VERSION }}.zip | cut -d' ' -f1)
          echo "SHA256: $CHECKSUM"
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fba-finder-chrome-store-${{ steps.get_version.outputs.VERSION }}
          path: fba-finder-chrome-store-${{ steps.get_version.outputs.VERSION }}.zip
          retention-days: 90

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: fba-finder-chrome-store-${{ steps.get_version.outputs.VERSION }}.zip
          body: |
            ## FBA Finder v${{ steps.get_version.outputs.VERSION }}
            
            ### 📦 Chrome Web Store Package
            
            **File:** `fba-finder-chrome-store-${{ steps.get_version.outputs.VERSION }}.zip`
            **SHA256:** `${{ steps.checksum.outputs.CHECKSUM }}`
            
            ### 🚀 Installation
            
            1. Download the ZIP file above
            2. Go to `chrome://extensions/`
            3. Enable "Developer mode"
            4. Click "Load unpacked"
            5. Extract the ZIP and select the folder
            
            ### 📤 Chrome Web Store Submission
            
            1. Go to [Chrome Web Store Developer Dashboard](https://chrome.google.com/webstore/devconsole)
            2. Click "New Item"
            3. Upload this ZIP file
            4. Fill in store listing details
            
            ### 📝 Changelog
            
            See [CHANGELOG.md](CHANGELOG.md) for full details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## ✅ Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**File:** fba-finder-chrome-store-${{ steps.get_version.outputs.VERSION }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256:** \`${{ steps.checksum.outputs.CHECKSUM }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact from the Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Upload to Chrome Web Store" >> $GITHUB_STEP_SUMMARY
          echo "3. Update store listing with details from STORE_LISTING.md" >> $GITHUB_STEP_SUMMARY
